<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Playground</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/bash.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/json.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/sql.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/java.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/cpp.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/rust.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/go.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/typescript.min.js"></script>
    <style>
:root{--primary:#6366f1;--primary-light:#818cf8;--secondary:#a855f7;--accent:#ec4899;--bg-primary:#0f0f1a;--bg-secondary:#1a1a2e;--bg-tertiary:#252542;--bg-hover:#2d2d5a;--text-primary:#f1f5f9;--text-secondary:#94a3b8;--text-muted:#64748b;--border:#334155;--border-light:#1e293b;--success:#22c55e;--error:#ef4444;--radius-sm:8px;--radius-md:12px;--radius-lg:16px;--shadow-sm:0 1px 2px rgba(0,0,0,0.3);--shadow-md:0 4px 6px rgba(0,0,0,0.4);--shadow-lg:0 10px 25px rgba(0,0,0,0.5);--transition:all 0.2s ease;--sidebar-width:280px;--top-bar-height:60px}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg-primary);color:var(--text-primary);line-height:1.5;overflow:hidden;height:100vh;width:100vw;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
.hidden{display:none!important}
.splash-screen{position:fixed;inset:0;background:var(--bg-primary);display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity 0.5s ease,visibility 0.5s ease}
.splash-screen.fade-out{opacity:0;visibility:hidden}
.splash-content{text-align:center;animation:splashFadeIn 0.6s ease}
@keyframes splashFadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.splash-logo{margin-bottom:20px;animation:splashPulse 2s ease-in-out infinite}
@keyframes splashPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.splash-title{font-size:2rem;font-weight:700;background:linear-gradient(135deg,var(--primary),var(--secondary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
.splash-subtitle{color:var(--text-secondary);font-size:0.95rem;margin-bottom:30px}
.splash-loader{width:200px;height:4px;background:var(--bg-tertiary);border-radius:2px;overflow:hidden;margin:0 auto}
.splash-loader-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--primary),var(--secondary));border-radius:2px;animation:splashLoad 1.5s ease-in-out forwards}
@keyframes splashLoad{0%{width:0%}50%{width:70%}100%{width:100%}}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;animation:modalFadeIn 0.2s ease}
@keyframes modalFadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius-lg);width:100%;max-width:420px;max-height:90vh;overflow-y:auto;animation:modalSlideIn 0.3s ease;box-shadow:var(--shadow-lg)}
@keyframes modalSlideIn{from{opacity:0;transform:translateY(20px) scale(0.95)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-header{padding:24px 24px 0;text-align:center}
.modal-header h2{font-size:1.25rem;font-weight:600;margin-bottom:6px}
.modal-header p{color:var(--text-secondary);font-size:0.875rem}
.modal-close{position:absolute;top:16px;right:16px;background:none;border:none;color:var(--text-secondary);font-size:1.5rem;cursor:pointer;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);transition:var(--transition)}
.modal-close:hover{background:var(--bg-hover);color:var(--text-primary)}
.modal-body{padding:20px 24px 24px}
.settings-modal{max-width:480px}
.settings-modal .modal-header{position:relative;text-align:left}
.settings-section{margin-bottom:24px;padding-bottom:20px;border-bottom:1px solid var(--border-light)}
.settings-section:last-of-type{border-bottom:none}
.settings-section h3{font-size:0.875rem;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:12px}
.input-group{margin-bottom:16px}
.input-group label{display:block;font-size:0.875rem;font-weight:500;margin-bottom:6px;color:var(--text-primary)}
.input-group input,.input-group select,.input-group textarea{width:100%;padding:10px 14px;background:var(--bg-tertiary);border:1px solid var(--border);border-radius:var(--radius-md);color:var(--text-primary);font-size:0.9rem;font-family:inherit;transition:var(--transition);outline:none}
.input-group input:focus,.input-group select:focus,.input-group textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,0.15)}
.input-group input::placeholder{color:var(--text-muted)}
.input-group small{display:block;margin-top:4px;font-size:0.75rem;color:var(--text-muted)}
.input-group small a{color:var(--primary-light);text-decoration:none}
.input-group small a:hover{text-decoration:underline}
.toggle-group{display:flex;align-items:center;justify-content:space-between;padding:8px 0}
.toggle-group label:first-child{font-size:0.9rem;color:var(--text-primary)}
.toggle-switch{position:relative;width:44px;height:24px;cursor:pointer}
.toggle-switch input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:var(--bg-tertiary);border-radius:24px;transition:var(--transition);border:1px solid var(--border)}
.toggle-slider::before{content:'';position:absolute;height:18px;width:18px;left:2px;bottom:2px;background:var(--text-secondary);border-radius:50%;transition:var(--transition)}
.toggle-switch input:checked+.toggle-slider{background:var(--primary);border-color:var(--primary)}
.toggle-switch input:checked+.toggle-slider::before{transform:translateX(20px);background:white}
.btn-primary{width:100%;padding:12px;background:linear-gradient(135deg,var(--primary),var(--secondary));border:none;border-radius:var(--radius-md);color:white;font-size:0.95rem;font-weight:600;cursor:pointer;transition:var(--transition);font-family:inherit}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 15px rgba(99,102,241,0.4)}
.btn-primary:active{transform:translateY(0)}
.btn-danger{width:100%;padding:10px;background:transparent;border:1px solid var(--error);border-radius:var(--radius-md);color:var(--error);font-size:0.85rem;cursor:pointer;transition:var(--transition);font-family:inherit;margin-bottom:8px}
.btn-danger:hover{background:rgba(239,68,68,0.1)}
.modal-note{text-align:center;font-size:0.75rem;color:var(--text-muted);margin-top:12px}
.app{display:flex;height:100vh;width:100vw;overflow:hidden}
.sidebar{width:var(--sidebar-width);min-width:var(--sidebar-width);background:var(--bg-secondary);border-right:1px solid var(--border-light);display:flex;flex-direction:column;transition:var(--transition);z-index:100}
.sidebar.collapsed{width:0;min-width:0;overflow:hidden;border-right:none}
.sidebar-header{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 12px;border-bottom:1px solid var(--border-light)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.1rem}
.logo svg{flex-shrink:0}
.sidebar-toggle{background:none;border:none;color:var(--text-secondary);cursor:pointer;padding:6px;border-radius:var(--radius-sm);transition:var(--transition);display:none}
.sidebar-toggle:hover{background:var(--bg-hover);color:var(--text-primary)}
.new-chat-btn{display:flex;align-items:center;justify-content:center;gap:8px;margin:12px 16px;padding:10px;background:var(--bg-tertiary);border:1px solid var(--border);border-radius:var(--radius-md);color:var(--text-primary);font-size:0.9rem;font-weight:500;cursor:pointer;transition:var(--transition);font-family:inherit}
.new-chat-btn:hover{background:var(--bg-hover);border-color:var(--primary)}
.sidebar-section{flex:1;overflow-y:auto;padding:0 12px;margin-bottom:8px}
.sidebar-section h3{font-size:0.7rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.08em;padding:12px 4px 8px;position:sticky;top:0;background:var(--bg-secondary);z-index:1}
.chat-history-list,.template-list{display:flex;flex-direction:column;gap:4px}
.history-item,.template-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-sm);cursor:pointer;transition:var(--transition);font-size:0.85rem;color:var(--text-secondary);position:relative;overflow:hidden}
.history-item:hover,.template-item:hover{background:var(--bg-hover);color:var(--text-primary)}
.history-item.active{background:rgba(99,102,241,0.15);color:var(--primary-light);border-left:2px solid var(--primary)}
.history-item svg,.template-item svg{flex-shrink:0;opacity:0.6}
.history-title{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.history-actions{display:flex;gap:4px;opacity:0;transition:var(--transition)}
.history-item:hover .history-actions{opacity:1}
.history-action-btn{background:none;border:none;color:var(--text-muted);cursor:pointer;padding:2px;border-radius:4px;transition:var(--transition)}
.history-action-btn:hover{color:var(--error);background:rgba(239,68,68,0.1)}
.sidebar-footer{padding:12px 16px;border-top:1px solid var(--border-light)}
.sidebar-footer-btn{display:flex;align-items:center;gap:10px;width:100%;padding:10px;background:none;border:none;border-radius:var(--radius-sm);color:var(--text-secondary);font-size:0.9rem;cursor:pointer;transition:var(--transition);font-family:inherit}
.sidebar-footer-btn:hover{background:var(--bg-hover);color:var(--text-primary)}
.main-content{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg-primary)}
.top-bar{height:var(--top-bar-height);display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--border-light);background:var(--bg-primary);flex-shrink:0}
.mobile-menu-btn{display:none;background:none;border:none;color:var(--text-secondary);cursor:pointer;padding:8px;border-radius:var(--radius-sm)}
.top-bar-center{display:flex;align-items:center;gap:12px;flex:1;justify-content:center}
.top-bar-center h2{font-size:1rem;font-weight:600;color:var(--text-primary)}
.model-selector{padding:6px 12px;background:var(--bg-tertiary);border:1px solid var(--border);border-radius:var(--radius-md);color:var(--text-secondary);font-size:0.8rem;cursor:pointer;outline:none;font-family:inherit}
.model-selector:focus{border-color:var(--primary)}
.top-bar-actions{display:flex;gap:6px}
.icon-btn{background:none;border:none;color:var(--text-secondary);cursor:pointer;padding:8px;border-radius:var(--radius-sm);transition:var(--transition);display:flex;align-items:center;justify-content:center}
.icon-btn:hover{background:var(--bg-hover);color:var(--text-primary)}
.chat-container{flex:1;overflow-y:auto;padding:20px;scroll-behavior:smooth}
.chat-container::-webkit-scrollbar,.sidebar-section::-webkit-scrollbar{width:6px}
.chat-container::-webkit-scrollbar-track,.sidebar-section::-webkit-scrollbar-track{background:transparent}
.chat-container::-webkit-scrollbar-thumb,.sidebar-section::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.chat-container::-webkit-scrollbar-thumb:hover,.sidebar-section::-webkit-scrollbar-thumb:hover{background:var(--text-muted)}
.welcome-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;gap:40px;animation:welcomeFadeIn 0.5s ease}
@keyframes welcomeFadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.welcome-hero{text-align:center}
.welcome-icon{margin-bottom:20px}
.welcome-hero h1{font-size:1.75rem;font-weight:700;margin-bottom:8px;background:linear-gradient(135deg,var(--primary),var(--secondary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.welcome-hero p{color:var(--text-secondary);font-size:1rem}
.quick-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:600px;width:100%}
.quick-action{display:flex;align-items:center;gap:12px;padding:16px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius-md);color:var(--text-primary);font-size:0.9rem;cursor:pointer;transition:var(--transition);text-align:left;font-family:inherit}
.quick-action:hover{background:var(--bg-hover);border-color:var(--primary);transform:translateY(-2px);box-shadow:var(--shadow-md)}
.quick-icon{font-size:1.5rem;flex-shrink:0}
.messages{display:flex;flex-direction:column;gap:16px;max-width:800px;margin:0 auto;width:100%;padding-bottom:20px}
.message{display:flex;gap:12px;animation:messageSlideIn 0.3s ease}
@keyframes messageSlideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.message-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:0.9rem}
.message.user .message-avatar{background:linear-gradient(135deg,var(--primary),var(--secondary));order:2}
.message.assistant .message-avatar{background:var(--bg-tertiary);border:1px solid var(--border)}
.message-content{flex:1;padding:12px 16px;border-radius:var(--radius-md);font-size:0.95rem;line-height:1.6;word-wrap:break-word;overflow-wrap:break-word}
.message.user .message-content{background:linear-gradient(135deg,var(--primary),var(--secondary));color:white;border-bottom-right-radius:4px;margin-left:auto;max-width:85%}
.message.assistant .message-content{background:var(--bg-secondary);border:1px solid var(--border);border-bottom-left-radius:4px;max-width:90%}
.message-content p{margin-bottom:8px}
.message-content p:last-child{margin-bottom:0}
.message-content ul,.message-content ol{margin:8px 0;padding-left:20px}
.message-content li{margin-bottom:4px}
.message-content strong{font-weight:600}
.message-content code{background:rgba(99,102,241,0.15);padding:2px 6px;border-radius:4px;font-family:'SF Mono',Monaco,monospace;font-size:0.85em}
.message-content pre{background:#1e1e2e;border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;overflow-x:auto;margin:12px 0;position:relative}
.message-content pre code{background:none;padding:0;font-size:0.85rem;line-height:1.5}
.code-block-header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--bg-tertiary);border:1px solid var(--border);border-bottom:none;border-radius:var(--radius-sm) var(--radius-sm) 0 0;font-size:0.8rem;color:var(--text-muted)}
.code-block-header+pre{border-radius:0 0 var(--radius-sm) var(--radius-sm);margin-top:0}
.copy-code-btn{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:0.75rem;display:flex;align-items:center;gap:4px;transition:var(--transition)}
.copy-code-btn:hover{color:var(--text-primary)}
.message-content blockquote{border-left:3px solid var(--primary);padding-left:12px;margin:8px 0;color:var(--text-secondary)}
.message-content table{width:100%;border-collapse:collapse;margin:12px 0;font-size:0.9rem}
.message-content th,.message-content td{padding:8px 12px;border:1px solid var(--border);text-align:left}
.message-content th{background:var(--bg-tertiary);font-weight:600}
.message-content a{color:var(--primary-light);text-decoration:none}
.message-content a:hover{text-decoration:underline}
.typing-indicator{display:flex;align-items:center;gap:4px;padding:16px}
.typing-indicator span{width:8px;height:8px;background:var(--primary);border-radius:50%;animation:typingBounce 1.4s ease-in-out infinite}
.typing-indicator span:nth-child(2){animation-delay:0.2s}
.typing-indicator span:nth-child(3){animation-delay:0.4s}
@keyframes typingBounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-8px)}}
.input-area{padding:12px 20px 16px;background:var(--bg-primary);border-top:1px solid var(--border-light);flex-shrink:0}
.input-wrapper{display:flex;align-items:flex-end;gap:8px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:var(--radius-lg);padding:8px 12px;transition:var(--transition);max-width:800px;margin:0 auto}
.input-wrapper:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,0.1)}
.input-wrapper textarea{flex:1;background:none;border:none;color:var(--text-primary);font-size:0.95rem;font-family:inherit;resize:none;outline:none;max-height:150px;min-height:24px;line-height:1.5;padding:6px 4px}
.input-wrapper textarea::placeholder{color:var(--text-muted)}
.input-actions{display:flex;align-items:center;gap:6px;flex-shrink:0}
.input-action-btn{background:none;border:none;color:var(--text-muted);cursor:pointer;padding:6px;border-radius:var(--radius-sm);transition:var(--transition);display:flex;align-items:center;justify-content:center}
.input-action-btn:hover{color:var(--text-primary);background:var(--bg-hover)}
.send-btn{background:linear-gradient(135deg,var(--primary),var(--secondary));border:none;color:white;cursor:pointer;padding:8px;border-radius:var(--radius-sm);transition:var(--transition);display:flex;align-items:center;justify-content:center}
.send-btn:hover:not(:disabled){transform:scale(1.05);box-shadow:0 2px 10px rgba(99,102,241,0.4)}
.send-btn:disabled{opacity:0.4;cursor:not-allowed}
.input-hint{text-align:center;font-size:0.7rem;color:var(--text-muted);margin-top:8px}
.toast-container{position:fixed;bottom:20px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 20px;border-radius:var(--radius-md);font-size:0.9rem;font-weight:500;animation:toastSlideIn 0.3s ease;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:8px;max-width:350px}
@keyframes toastSlideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
.toast.success{background:var(--success);color:white}
.toast.error{background:var(--error);color:white}
.toast.info{background:var(--primary);color:white}
@media(max-width:768px){:root{--sidebar-width:260px}.sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);box-shadow:var(--shadow-lg)}.sidebar.open{transform:translateX(0)}.sidebar.collapsed{transform:translateX(-100%)}.mobile-menu-btn{display:flex}.top-bar-center h2{display:none}.quick-actions{grid-template-columns:1fr}.message.user .message-content,.message.assistant .message-content{max-width:95%}.welcome-hero h1{font-size:1.4rem}.splash-title{font-size:1.5rem}.toast-container{left:20px;right:20px}.toast{max-width:100%}}
@media(max-width:480px){.chat-container{padding:12px}.input-area{padding:8px 12px 12px}.top-bar{padding:0
